<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TES End-to-End User QA Test Runner</title>
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section id="loading-screen" class="screen screen--centered">
        <p>Loading...</p>
      </section>
    </main>

    <div id="qa-results" style="display:none;"></div>

    <script defer src="js/game.bundle.js"></script>
    <script>
      window.__QA_RUNNER__ = async function() {
        const results = [];
        function pass(name, detail = "") {
          console.log(`[PASS] ${name} ${detail}`);
          results.push({ status: "PASS", name, detail });
        }
        function fail(name, error) {
          console.error(`[FAIL] ${name}: ${error}`);
          results.push({ status: "FAIL", name, error: String(error) });
        }

        // Helper: wait for ms
        const wait = (ms) => new Promise((res) => setTimeout(res, ms));

        try {
          // Wait for game initialization
          let retries = 50;
          while (!document.querySelector(".tes-shell") && retries > 0) {
            await wait(50);
            retries--;
          }
          if (!document.querySelector(".tes-shell")) {
            throw new Error("Application failed to mount .tes-shell within timeout");
          }
          pass("QA-1: Application Boot & Shell Mounted");

          const app = document.getElementById("app");

          // Ensure we have devMode and demo state with Transistor Board unlocked and energy
          // Find dev button and enable dev mode if not active
          const devBtn = document.querySelector('[data-field="dev-mode-btn"]');
          if (devBtn) {
            devBtn.click();
            await wait(20);
          }

          // Inject energy via cheat or engine if available
          const cheatEnergyBtn = document.querySelector('[data-action="add-energy"][data-amount="1"]');
          if (cheatEnergyBtn) cheatEnergyBtn.click();

          // ---- TEST: Navigation Tabs ----
          const devicesTabBtn = document.querySelector('.tes-nav-tab[data-tab="devices"]');
          if (!devicesTabBtn) throw new Error("Devices nav tab not found");
          devicesTabBtn.click();
          await wait(60);

          const tabDevices = document.getElementById("tab-devices");
          const tabEnergy = document.getElementById("tab-energy");
          if (tabDevices.style.display !== "flex" || tabEnergy.style.display !== "none") {
            throw new Error(`Tab switch failed: devices display=${tabDevices.style.display}, energy display=${tabEnergy.style.display}`);
          }
          pass("QA-2: Navigation Tab Transition to Devices Screen");

          // Ensure Transistor Board is owned for testing
          // If not owned, buy it or trigger dev mode
          const boardRow = document.querySelector('[data-device-id="transistorBoard"]');
          if (!boardRow) throw new Error("Transistor Board row not found on Devices tab");

          let allocateBtn = boardRow.querySelector('[data-action="open-drawer"][data-drawer="transistor"]');
          if (!allocateBtn) {
            // Need to buy transistor board first
            const buyBoardBtn = boardRow.querySelector('[data-action="buy-element"][data-element-id="transistorBoard"]');
            if (buyBoardBtn) {
              buyBoardBtn.click();
              await wait(60);
            }
            allocateBtn = boardRow.querySelector('[data-action="open-drawer"][data-drawer="transistor"]');
          }
          if (!allocateBtn) {
            throw new Error("Transistor Board Allocate button not available after purchase");
          }
          pass("QA-3: Transistor Board Active & Allocate Button Available");

          // ---- TEST: Open Transistor Allocation Drawer ----
          allocateBtn.click();
          await wait(100);

          let drawer = document.querySelector(".tes-drawer");
          if (!drawer) throw new Error("Drawer did not mount after clicking Allocate");
          const title = drawer.querySelector(".tes-modal-title");
          if (!title || !title.textContent.includes("Transistor")) {
            throw new Error(`Drawer title mismatch: ${title?.textContent}`);
          }
          pass("QA-4: Transistor Allocation Drawer Opened Smoothly");

          // Read initial metrics
          const totalEl = drawer.querySelector('[data-field="drawer-t-total"]');
          const costEl = drawer.querySelector('[data-field="drawer-t-cost"]');
          const initialTotalText = totalEl.textContent;
          const initialTotal = parseInt(initialTotalText, 10) || 0;
          pass("QA-5: Initial Transistor Drawer Metrics Verified", `(Total: ${initialTotal})`);

          // ---- TEST: Click +1 Transistor Purchase Button inside Drawer ----
          const buy1Btn = drawer.querySelector('[data-field="drawer-buy-t-1"]');
          if (!buy1Btn) throw new Error("+1 Transistor purchase button not found in drawer");
          if (buy1Btn.disabled) {
            // Click cheat button to ensure sufficient energy
            const addEnergyBtn = document.querySelector('[data-action="add-energy"][data-amount="1"]');
            if (addEnergyBtn) addEnergyBtn.click();
            await wait(60);
          }

          buy1Btn.click();
          await wait(80);

          const afterBuy1Total = parseInt(drawer.querySelector('[data-field="drawer-t-total"]').textContent, 10);
          if (afterBuy1Total !== initialTotal + 1) {
            throw new Error(`+1 Transistor click failed to increment total: was ${initialTotal}, now ${afterBuy1Total}`);
          }
          pass("QA-6: +1 Transistor Button Click Successfully Incremented Total", `(New Total: ${afterBuy1Total})`);

          // ---- TEST: Click +10 Transistors Purchase Button inside Drawer ----
          const buy10Btn = drawer.querySelector('[data-field="drawer-buy-t-10"]');
          if (!buy10Btn) throw new Error("+10 Transistors purchase button not found in drawer");
          buy10Btn.click();
          await wait(80);

          const afterBuy10Total = parseInt(drawer.querySelector('[data-field="drawer-t-total"]').textContent, 10);
          if (afterBuy10Total !== afterBuy1Total + 10) {
            throw new Error(`+10 Transistors click failed: expected ${afterBuy1Total + 10}, got ${afterBuy10Total}`);
          }
          pass("QA-7: +10 Transistors Bulk Button Click Successfully Added 10 Units", `(New Total: ${afterBuy10Total})`);

          // ---- TEST: Transistor Reassignment: Move from AImp to AUpg ----
          const aimpAllocEl = drawer.querySelector('[data-field="drawer-t-aimp"]');
          const aupgAllocEl = drawer.querySelector('[data-field="drawer-t-aupg"]');
          const aimpBefore = parseInt(aimpAllocEl.textContent, 10);
          const aupgBefore = parseInt(aupgAllocEl.textContent, 10);

          const reassignToUpgBtn = drawer.querySelector('[data-field="drawer-reassign-aimp-aupg"]');
          if (!reassignToUpgBtn) throw new Error("Reassign button (+1 from AImp to AUpg) not found");
          if (reassignToUpgBtn.disabled) throw new Error("Reassign button is unexpectedly disabled");

          reassignToUpgBtn.click();
          await wait(80);

          const aimpAfter = parseInt(drawer.querySelector('[data-field="drawer-t-aimp"]').textContent, 10);
          const aupgAfter = parseInt(drawer.querySelector('[data-field="drawer-t-aupg"]').textContent, 10);

          if (aimpAfter !== aimpBefore - 1 || aupgAfter !== aupgBefore + 1) {
            throw new Error(`Reassignment failed: AImp ${aimpBefore}->${aimpAfter}, AUpg ${aupgBefore}->${aupgAfter}`);
          }
          pass("QA-8: Reassign Transistor from AImp to AUpg Verified in Real DOM", `(AImp: ${aimpAfter}, AUpg: ${aupgAfter})`);

          // ---- TEST: Transistor Reassignment: Move from AUpg back to AImp ----
          const reassignToImpBtn = drawer.querySelector('[data-field="drawer-reassign-aupg-aimp"]');
          if (!reassignToImpBtn) throw new Error("Reassign button (+1 from AUpg to AImp) not found");
          if (reassignToImpBtn.disabled) throw new Error("Reassign to AImp button is disabled despite AUpg > 0");

          reassignToImpBtn.click();
          await wait(80);

          const aimpAfterBack = parseInt(drawer.querySelector('[data-field="drawer-t-aimp"]').textContent, 10);
          const aupgAfterBack = parseInt(drawer.querySelector('[data-field="drawer-t-aupg"]').textContent, 10);

          if (aimpAfterBack !== aimpAfter + 1 || aupgAfterBack !== aupgAfter - 1) {
            throw new Error(`Reverse reassignment failed: AImp ${aimpAfter}->${aimpAfterBack}, AUpg ${aupgAfter}->${aupgAfterBack}`);
          }
          pass("QA-9: Reverse Reassign Transistor from AUpg to AImp Verified in Real DOM");

          // ---- TEST: Distribute Evenly (Rebalance) Button ----
          const rebalanceBtn = drawer.querySelector('[data-field="drawer-rebalance-btn"]');
          if (!rebalanceBtn) throw new Error("Distribute Evenly button not found");
          rebalanceBtn.click();
          await wait(80);

          const aimpBalanced = parseInt(drawer.querySelector('[data-field="drawer-t-aimp"]').textContent, 10);
          const aupgBalanced = parseInt(drawer.querySelector('[data-field="drawer-t-aupg"]').textContent, 10);
          if (Math.abs(aimpBalanced - aupgBalanced) > 1) {
            throw new Error(`Rebalance was not even: AImp=${aimpBalanced}, AUpg=${aupgBalanced}`);
          }
          pass("QA-10: Distribute Evenly Button Click Balanced Transistors Across Algorithms", `(AImp: ${aimpBalanced}, AUpg: ${aupgBalanced})`);

          // ---- TEST: Close Drawer via Close Button (&times;) ----
          const closeBtn = drawer.querySelector('[data-action="close-drawer"]');
          if (!closeBtn) throw new Error("Close button not found in drawer header");
          closeBtn.click();
          await wait(80);

          if (document.querySelector(".tes-drawer")) {
            throw new Error("Drawer is still present in DOM after clicking close button");
          }
          pass("QA-11: Close Drawer Button Click Removed Drawer from DOM");

          // ---- TEST: Microprocessor Installation & Configuration Drawer ----
          const microRow = document.querySelector('[data-device-id="microprocessor"]');
          if (!microRow) throw new Error("Microprocessor row not found on Devices tab");

          const rowInstallBtn = microRow.querySelector('[data-field="micro-action-btn"]');
          if (!rowInstallBtn) throw new Error("Microprocessor row action button not found");
          if (rowInstallBtn.disabled) {
            throw new Error(`Microprocessor action button unexpectedly disabled on row: ${rowInstallBtn.title || "no reason"}`);
          }
          pass("QA-12A: Microprocessor Row Action Button is Active & Eligible at Sufficient Energy");

          const configMicroBtn = microRow.querySelector('[data-action="open-drawer"][data-drawer="microprocessor"]');
          if (!configMicroBtn) throw new Error("Configure button not found on Microprocessor row");
          configMicroBtn.click();
          await wait(80);

          const microDrawer = document.querySelector(".tes-drawer");
          if (!microDrawer) throw new Error("Microprocessor drawer failed to open");

          // Test installing from the drawer
          const drawerInstallBtn = microDrawer.querySelector('[data-field="drawer-micro-install-btn"]');
          if (!drawerInstallBtn) throw new Error("Install button not found inside Microprocessor drawer");
          if (drawerInstallBtn.disabled) throw new Error("Install button inside Microprocessor drawer is disabled");

          drawerInstallBtn.click();
          await wait(80);

          const installedBadge = microDrawer.querySelector('.badge-status--active');
          if (!installedBadge || !installedBadge.textContent.includes("Installed")) {
            throw new Error("Drawer failed to update to Installed status after clicking Install");
          }
          pass("QA-12B: Microprocessor Successfully Installed via Drawer Click & UI State Updated to Installed");

          // Test target switching
          const targetUpgBtn = microDrawer.querySelector('[data-micro-target-btn="AUpg"]');
          if (!targetUpgBtn) throw new Error("Target AUpg button not found in Microprocessor drawer");
          targetUpgBtn.click();
          await wait(60);
          const targetText = microDrawer.querySelector('[data-field="drawer-micro-target"]')?.textContent;
          if (targetText !== "AUpg") throw new Error(`Micro target did not change to AUpg, shows ${targetText}`);
          pass("QA-12C: Microprocessor Target Successfully Switched to AUpg in Drawer");

          // Close micro drawer
          const closeMicroBtn = microDrawer.querySelector('[data-action="close-drawer"]');
          if (closeMicroBtn) closeMicroBtn.click();
          await wait(60);

          // Verify row UI reflects Installed state
          if (rowInstallBtn.textContent !== "Installed" || !rowInstallBtn.disabled) {
            throw new Error(`Row action button did not update to Installed disabled state: text=${rowInstallBtn.textContent}, disabled=${rowInstallBtn.disabled}`);
          }
          pass("QA-12D: Microprocessor Row Correctly Displays Installed (Disabled) After Purchase");

          // ---- TEST: Study Action on Energy Tab ----
          document.querySelector('.tes-nav-tab[data-tab="energy"]').click();
          await wait(60);

          const studyAImpBtn = document.querySelector('[data-field="aimp-study-btn"]');
          if (!studyAImpBtn) throw new Error("Study AImp button not found on Energy tab");
          studyAImpBtn.click();
          await wait(40);
          pass("QA-13: Energy Tab Study A.Imp Click Dispatched to Engine");

          // ---- TEST: Info Popover ----
          const crcInfoBtn = document.querySelector('[data-action="show-info"][data-topic="crc"]');
          if (crcInfoBtn) {
            crcInfoBtn.click();
            await wait(60);
            const popover = document.querySelector(".tes-popover");
            if (!popover || !popover.textContent.includes("Cosmic Radiation")) {
              throw new Error("CRC Popover did not open or content missing");
            }
            pass("QA-14: Info Popover Opened with Relevant Telemetry Text");
            // Click outside to close
            document.body.click();
            await wait(60);
          }

          // ---- TEST: Energy Dynamics & Decay Popover on Net / Info Button ----
          const energySummaryBtn = document.querySelector('[data-action="show-info"][data-topic="energy-summary"]');
          if (energySummaryBtn) {
            energySummaryBtn.click();
            await wait(60);
            const popover = document.querySelector(".tes-popover");
            if (
              !popover ||
              !popover.textContent.includes("Stable Capacity") ||
              !popover.textContent.includes("Overflow Decay") ||
              !popover.textContent.includes("Net Production")
            ) {
              throw new Error("Energy Summary Popover missing decay/capacity telemetry details");
            }
            pass("QA-14B: Energy Summary Popover Explains Stable Capacity, Overflow Decay and Net Production");
            document.body.click();
            await wait(60);
          }

          // Hover on Net item test
          const netItem = document.querySelector("#energy-net-item");
          if (netItem) {
            netItem.dispatchEvent(new MouseEvent("mouseenter", { bubbles: true }));
            await wait(60);
            const hoverPopover = document.querySelector(".tes-popover");
            if (!hoverPopover || !hoverPopover.textContent.includes("Overflow Decay")) {
              throw new Error("Hover on Net item failed to display tooltip popover");
            }
            netItem.dispatchEvent(new MouseEvent("mouseleave", { bubbles: true }));
            await wait(250);
            pass("QA-14C: Hover on Net item triggered Energy Dynamics Tooltip smoothly");
          }

          // ---- TEST: Device Filter Pills on Devices Tab ----
          document.querySelector('.tes-nav-tab[data-tab="devices"]').click();
          await wait(60);

          const autoFilterPill = document.querySelector('.tes-filter-pill[data-filter="automation"]');
          if (autoFilterPill) {
            autoFilterPill.click();
            await wait(60);
            if (!autoFilterPill.classList.contains("tes-filter-pill--active")) {
              throw new Error("Filter pill active state failed");
            }
            pass("QA-15: Device Filter Pill Filtered Group to Automation");
            // Reset to All
            document.querySelector('.tes-filter-pill[data-filter="all"]').click();
            await wait(60);
          }

          // ---- TEST: Hard Disk State Drawer ----
          // In demo mode or if harddisk unlocked
          const hdRow = document.querySelector('[data-device-id="hardDisk"]');
          if (hdRow && hdRow.style.display !== "none") {
            const hdBtn = hdRow.querySelector('[data-action="open-drawer"][data-drawer="harddisk"]');
            if (hdBtn) {
              hdBtn.click();
              await wait(60);
              const hdDrawer = document.querySelector(".tes-drawer");
              if (hdDrawer) {
                const btnActive = hdDrawer.querySelector('[data-hd-btn="active"]');
                if (btnActive) {
                  btnActive.click();
                  await wait(60);
                  pass("QA-16: Hard Disk State Changed to Active via Drawer");
                }
                const closeHdBtn = hdDrawer.querySelector('[data-action="close-drawer"]');
                if (closeHdBtn) closeHdBtn.click();
                await wait(60);
              }
            }
          }

          // ---- TEST: Dev Drawer Quicksave & State Verification ----
          const devHeaderBtn = document.querySelector('[data-field="dev-mode-btn"]');
          if (devHeaderBtn) {
            // Open dev drawer via open-drawer button or header
            const openDevBtn = document.querySelector('[data-action="open-drawer"][data-drawer="dev"]');
            if (openDevBtn) {
              openDevBtn.click();
              await wait(80);
              const devDrawer = document.querySelector(".tes-drawer");
              if (devDrawer) {
                const quicksaveBtn = devDrawer.querySelector('[data-action="quicksave"]');
                if (quicksaveBtn) {
                  quicksaveBtn.click();
                  await wait(60);
                  pass("QA-17: Quicksave Milestone Snapshot Captured Successfully");
                }
                const closeDevBtn = devDrawer.querySelector('[data-action="close-drawer"]');
                if (closeDevBtn) closeDevBtn.click();
                await wait(60);
              }
            }
          }

          // ---- TEST: Settings Modal & Engineering Notation Switching ----
          const settingsBtn = document.querySelector('[data-action="open-drawer"][data-drawer="settings"]');
          if (!settingsBtn) throw new Error("Settings button not found");
          settingsBtn.click();
          await wait(80);

          const settingsModal = document.querySelector(".tes-modal");
          if (!settingsModal) throw new Error("Settings modal did not open");

          const optEng = settingsModal.querySelector('input[value="engineering"]');
          const optEngNum = settingsModal.querySelector('input[value="engineering_num"]');
          const optAlpha = settingsModal.querySelector('input[value="alpha"]');
          if (!optEng || !optEngNum || !optAlpha) {
            throw new Error("One or more notation options are missing from the Settings modal");
          }
          pass("QA-18: Settings Modal Opened & All 3 Notation Options Rendered");

          // Switch to Engineering Num
          optEngNum.click();
          optEngNum.dispatchEvent(new Event("change", { bubbles: true }));
          await wait(60);

          const railEnergyEngNum = document.querySelector('[data-field="rail-energy"]')?.textContent || "";
          if (!railEnergyEngNum.includes("e") && !railEnergyEngNum.includes("J")) {
            throw new Error("Rail energy does not reflect Engineering Num format: " + railEnergyEngNum);
          }
          pass("QA-19: Switched to Engineering Num (-3, -6, -9, ...) & UI Formats Updated");

          // Switch to Alpha
          optAlpha.click();
          optAlpha.dispatchEvent(new Event("change", { bubbles: true }));
          await wait(60);

          const railEnergyAlpha = document.querySelector('[data-field="rail-energy"]')?.textContent || "";
          if (!railEnergyAlpha.includes("J")) {
            throw new Error("Rail energy does not reflect Alpha format: " + railEnergyAlpha);
          }
          pass("QA-20: Switched to Alpha (c, b, a, A, B, C) & UI Formats Updated");

          // Switch back to Engineering (SI)
          optEng.click();
          optEng.dispatchEvent(new Event("change", { bubbles: true }));
          await wait(60);

          const railEnergyEng = document.querySelector('[data-field="rail-energy"]')?.textContent || "";
          if (!railEnergyEng.includes("J")) {
            throw new Error("Rail energy does not reflect Engineering format: " + railEnergyEng);
          }
          pass("QA-21: Switched back to Engineering (m, u, n, p, K, M, G, T) Successfully");

          // Close Settings Modal
          const closeSettingsBtn = settingsModal.querySelector('[data-action="close-drawer"]');
          if (closeSettingsBtn) closeSettingsBtn.click();
          await wait(60);

          // ---- TEST: Offline Recovery Modal ----
          // Open offline recovery drawer to verify presentation
          const openOfflineDrawerBtn = document.querySelector('[data-action="open-drawer"][data-drawer="offline"]');
          // If not in DOM direct trigger, open via action or simulate
          const drawersContainer = document.getElementById("tes-drawers-container");
          const offlineTrigger = document.createElement("button");
          offlineTrigger.setAttribute("data-action", "open-drawer");
          offlineTrigger.setAttribute("data-drawer", "offline");
          app.appendChild(offlineTrigger);
          offlineTrigger.click();
          await wait(80);
          offlineTrigger.remove();

          const offlineModal = document.querySelector(".tes-modal");
          if (!offlineModal || !offlineModal.textContent.includes("Offline Recovery")) {
            throw new Error("Offline Recovery modal did not open or title mismatch");
          }
          const resumeBtn = offlineModal.querySelector('[data-action="close-drawer"]');
          if (!resumeBtn) throw new Error("Resume Simulation button missing in offline modal");
          pass("QA-22: Offline Recovery Modal Rendered & Telemetry Metrics Displayed");

          resumeBtn.click();
          await wait(60);
          if (document.querySelector(".tes-modal")) {
            throw new Error("Offline modal did not close on Resume Simulation click");
          }
          pass("QA-23: Offline Recovery Modal Dismissed Smoothly on Resume Simulation");

          // ---- TEST: Return to Energy Tab & Verify Patch Features ----
          const energyNavBtn = document.querySelector('.tes-nav-tab[data-tab="energy"]');
          if (!energyNavBtn) throw new Error("Energy nav tab button not found");
          energyNavBtn.click();
          await wait(60);

          // QA-24: Energy Era Progress Bar
          const eraSec = document.querySelector(".tes-energy-era-section");
          if (!eraSec) throw new Error("Energy Era Progress Bar section missing in DOM");
          const eraLabel = eraSec.querySelector(".tes-energy-era-label");
          if (!eraLabel || eraLabel.textContent.trim() !== "Total Stored Energy Required") {
            throw new Error(`Energy Era label mismatch: '${eraLabel?.textContent}'`);
          }
          const eraPercent = eraSec.querySelector(".tes-energy-era-percent");
          if (!eraPercent || !eraPercent.textContent.includes("%")) {
            throw new Error("Energy Era percentage indicator missing or invalid");
          }
          pass("QA-24: Energy Era Progress Bar Rendered with Exact Label & Percentage");

          // QA-25: Study Improve Button & Claim Flow
          const improveBtnAImp = document.querySelector('.btn-study-improve[data-target="AImp"]');
          if (!improveBtnAImp) throw new Error("Study Improve button for AImp missing");

          // Ensure current owned studies equal milestone 1
          const m1 = window.__TES_ENGINE__?.config?.studyImprove?.initialMilestones?.[0] ?? 33;
          const m2 = window.__TES_ENGINE__?.config?.studyImprove?.initialMilestones?.[1] ?? 66;
          if (window.__TES_ENGINE__) {
            window.__TES_ENGINE__.state.algorithms.AImp.owned = m1;
            window.__TES_ENGINE__.state.studyImproves.AImp = { completions: m1, claimed: 0 };
            window.__TES_ENGINE__.tick(0.01);
            await wait(60);
          }
          if (improveBtnAImp.getAttribute("aria-disabled") === "true") {
            throw new Error(`Study Improve button should be active when owned (${m1}) >= threshold (${m1})`);
          }

          // Check discreet milestone hint exists
          const milestoneHint = improveBtnAImp.querySelector('[data-field="aimp-improve-milestone"]');
          if (!milestoneHint || !milestoneHint.textContent.includes(String(m1))) {
            throw new Error(`Discreet milestone hint missing or invalid: '${milestoneHint?.textContent}'`);
          }

          improveBtnAImp.click();
          await wait(60);

          if (window.__TES_ENGINE__ && window.__TES_ENGINE__.state.studyImproves.AImp.claimed !== 1) {
            throw new Error("Claimed count did not increment to 1");
          }
          if (improveBtnAImp.getAttribute("aria-disabled") !== "true") {
            throw new Error(`Study Improve button should be disabled after claim until next milestone (${m2})`);
          }
          pass("QA-25: Study Improve Button Claims Milestone & Updates Speed Multiplier");

          // QA-26: Install Transistor Card
          const installCardAImp = document.querySelector('.tes-install-transistor-card[data-target="AImp"]');
          if (!installCardAImp) throw new Error("Install Transistor card for AImp missing");
          const cardTitle = installCardAImp.querySelector(".tes-install-transistor-label");
          if (!cardTitle || !cardTitle.textContent.includes("Install Transistor")) {
            throw new Error(`Install Transistor title mismatch: '${cardTitle?.textContent}'`);
          }
          const initialCostText = installCardAImp.querySelector(".tes-install-transistor-cost")?.textContent || "";
          if (!initialCostText.includes("J")) {
            throw new Error(`Install Transistor cost missing Joules unit: '${initialCostText}'`);
          }

          const priorPurchased = window.__TES_ENGINE__ ? window.__TES_ENGINE__.state.devices.transistorsPurchased : 0;
          const priorAllocated = window.__TES_ENGINE__ ? (window.__TES_ENGINE__.state.devices.transistorAllocations.AImp || 0) : 0;

          installCardAImp.click();
          await wait(60);

          if (window.__TES_ENGINE__) {
            const postPurchased = window.__TES_ENGINE__.state.devices.transistorsPurchased;
            const postAllocated = window.__TES_ENGINE__.state.devices.transistorAllocations.AImp || 0;
            if (postPurchased !== priorPurchased + 1) {
              throw new Error(`Total transistors did not increment by 1: was ${priorPurchased}, now ${postPurchased}`);
            }
            if (postAllocated !== priorAllocated + 1) {
              throw new Error(`AImp allocation did not increment by 1: was ${priorAllocated}, now ${postAllocated}`);
            }
          }
          pass("QA-26: Install Transistor Card Purchases 1 Unit Directly Into Target Study");

          // QA-27: Available Data Cap
          if (window.__TES_ENGINE__) {
            window.__TES_ENGINE__.state.algorithms.AImp.owned = 10000;
            window.__TES_ENGINE__.tick(0.01);
            await wait(60);
          }
          const mlCard = document.querySelector(".tes-ml-card");
          const mlBar = mlCard?.querySelector('[data-field="ml-progress-bar"]');
          const mlText = mlCard?.querySelector('[data-field="ml-progress-text"]')?.textContent || "";
          if (mlBar?.style?.width !== "100%" && mlBar?.style?.width !== "100.0%") {
            throw new Error(`Machine learning progress bar should be clamped to 100%: '${mlBar?.style?.width}'`);
          }
          const parts = mlText.split("/");
          if (parts.length === 2 && parts[0].trim() !== parts[1].replace("Data", "").trim()) {
            throw new Error(`Available data should equal target requirement when capped: '${mlText}'`);
          }
          pass("QA-27: Available Data Clamped at ML Requirement with 100% Display Cap");

          // QA-28: Install Transistor Visibility (Hidden before Transistor Board owned)
          if (window.__TES_ENGINE__) {
            window.__TES_ENGINE__.state.devices.transistorBoard.owned = false;
            window.__TES_ENGINE__.state.devMode = false;
            window.__TES_ENGINE__.tick(0.01);
            if (window.__TES_RENDERER__) window.__TES_RENDERER__.render();
            await wait(60);
            if (installCardAImp.style.display !== "none") {
              throw new Error(`Install Transistor card must be hidden (display: none) when Transistor Board not owned; was '${installCardAImp.style.display}'`);
            }
            // Restore board ownership
            window.__TES_ENGINE__.state.devices.transistorBoard.owned = true;
            window.__TES_ENGINE__.state.devMode = true;
            window.__TES_ENGINE__.tick(0.01);
            if (window.__TES_RENDERER__) window.__TES_RENDERER__.render();
            await wait(60);
            if (installCardAImp.style.display === "none") {
              throw new Error("Install Transistor card must be visible once Transistor Board is owned");
            }
          }
          pass("QA-28: Install Transistor Card Hidden Until Transistor Board Owned");

          // QA-29: Keyboard Hotkey Execution (A, T, M)
          if (window.__TES_ENGINE__) {
            const startAImpOwned = window.__TES_ENGINE__.state.algorithms.AImp.owned;
            // Dispatch 'A' keydown
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "a", code: "KeyA", bubbles: true }));
            await wait(30);
            if (window.__TES_ENGINE__.continuousStudyTarget !== "AImp") {
              throw new Error("Pressing 'A' hotkey did not set continuous study target to AImp");
            }

            // Tick engine to complete cycle
            window.__TES_ENGINE__.tick(0.5);
            if (window.__TES_ENGINE__.state.algorithms.AImp.owned <= startAImpOwned) {
              throw new Error("Continuous 'A' hotkey did not produce AImp on tick");
            }

            // Dispatch 'A' keyup
            window.dispatchEvent(new KeyboardEvent("keyup", { key: "a", code: "KeyA", bubbles: true }));
            await wait(30);
            if (window.__TES_ENGINE__.continuousStudyTarget !== null) {
              throw new Error("Releasing 'A' hotkey did not clear continuous study target");
            }

            // Test 'T' hotkey
            const priorT = window.__TES_ENGINE__.state.devices.transistorsPurchased;
            window.__TES_ENGINE__.state.energy = new (window.__TES_ENGINE__.state.energy.constructor)("1.0");
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "t", code: "KeyT", bubbles: true }));
            await wait(30);
            window.dispatchEvent(new KeyboardEvent("keyup", { key: "t", code: "KeyT", bubbles: true }));
            if (window.__TES_ENGINE__.state.devices.transistorsPurchased <= priorT) {
              throw new Error("Pressing 'T' hotkey did not install transistors into AImp");
            }
          }
          pass("QA-29: Hotkeys 'A' and 'T' Successfully Executed via Window Keyboard Events");

          // QA-30: Simultaneous Hotkeys ('A' and 'U') Executing in Parallel
          if (window.__TES_ENGINE__) {
            window.__TES_ENGINE__.state.unlocks.AUpg = true;
            window.__TES_ENGINE__.state.algorithms.AImp.owned = 50;
            const startAUpg = window.__TES_ENGINE__.state.algorithms.AUpg.owned;

            // Press both 'A' and 'U'
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "a", code: "KeyA", bubbles: true }));
            window.dispatchEvent(new KeyboardEvent("keydown", { key: "u", code: "KeyU", bubbles: true }));
            await wait(30);

            if (!window.__TES_ENGINE__.state.manualStudies?.AImp?.active || !window.__TES_ENGINE__.state.manualStudies?.AUpg?.active) {
              throw new Error("Simultaneous 'A' and 'U' keys did not activate both studies in parallel");
            }

            // Tick 0.5s -> both complete concurrently
            window.__TES_ENGINE__.tick(0.5);
            if (window.__TES_ENGINE__.state.algorithms.AUpg.owned <= startAUpg) {
              throw new Error("Simultaneous studies tick did not produce AUpg");
            }

            // Release both keys
            window.dispatchEvent(new KeyboardEvent("keyup", { key: "a", code: "KeyA", bubbles: true }));
            window.dispatchEvent(new KeyboardEvent("keyup", { key: "u", code: "KeyU", bubbles: true }));
            await wait(30);

            if (window.__TES_ENGINE__.state.manualStudy.active) {
              throw new Error("Releasing both keys did not clear active manual studies");
            }
          }
          pass("QA-30: Simultaneous Hotkeys ('A' and 'U') Run Studies Concurrently in Parallel");

          // QA-31: Setup Optimization Card Trigger at Configured Level (Level 6) & Modal Flow
          const foCard = document.getElementById("fo-card");
          if (!foCard) {
            throw new Error("#fo-card element missing from DOM");
          }

          if (window.__TES_ENGINE__ && window.__TES_RENDERER__) {
            // Level 6 is configured
            window.__TES_ENGINE__.state.computerLevel = 6;
            window.__TES_ENGINE__.state.powerCells = 4;
            window.__TES_ENGINE__.state.studyImproves.AImp = { completions: 50, claimed: 1 };
            window.__TES_RENDERER__.render();
            await wait(30);

            if (foCard.style.display !== "flex") {
              throw new Error(`Expected #fo-card to be 'flex' at Level 6, got '${foCard.style.display}'`);
            }

            const foBtn = foCard.querySelector('[data-field="fo-action-btn"]');
            if (!foBtn) {
              throw new Error("Action button in #fo-card missing");
            }
            if (foBtn.disabled) {
              throw new Error("Expected Setup Optimization button to be enabled at Level 6");
            }

            // Clicking Setup Optimization button opens the disclaimer modal
            foBtn.click();
            await wait(50);

            const modalOverlay = document.querySelector('.tes-modal-overlay');
            if (!modalOverlay) {
              throw new Error("Setup Optimization modal overlay did not open");
            }

            // Check that first-time discovery alert is present in the modal
            const alertText = modalOverlay.textContent;
            if (!alertText.includes("Algorithm Recalculation (ARec)")) {
              throw new Error("Expected 1st-time ARec discovery notice in SO modal disclaimer");
            }

            // Click the confirm button inside the modal
            const confirmBtn = modalOverlay.querySelector('[data-action="perform-facility-optimization"]');
            if (!confirmBtn) {
              throw new Error("Confirm button missing from Setup Optimization modal");
            }
            confirmBtn.click();
            await wait(50);

            if ((window.__TES_ENGINE__.state.facilityOptimizations ?? 0) !== 1) {
              throw new Error("Clicking Setup Optimization did not increment facilityOptimizations to 1");
            }
            // Computer Level & MLs are PRESERVED (do not reset)
            if (window.__TES_ENGINE__.state.computerLevel !== 6) {
              throw new Error(`Computer Level must be preserved on Setup Optimization (expected 6, got ${window.__TES_ENGINE__.state.computerLevel})`);
            }
            // Study improves reset
            if (window.__TES_ENGINE__.state.studyImproves.AImp.claimed !== 0) {
              throw new Error("Study improves must reset to 0 on hard reset");
            }
            // Power Cells PRESERVED as sole exception
            if (window.__TES_ENGINE__.state.powerCells !== 4) {
              throw new Error("Power Cells must be preserved as the sole exception");
            }
          }
          pass("QA-31: Setup Optimization Card, In-Game Disclaimer Modal & Hard Reset Verified");

          // QA-32: Processor Reveal Condition (1e-6 J) & 5% Study Speed Bonus
          if (window.__TES_ENGINE__ && window.__TES_RENDERER__) {
            const engine = window.__TES_ENGINE__;
            const toBig = (v) => window.__TES_NUMERIC__?.big(v) || new (engine.state.energy.constructor)(v);
            const procElement = window.__TES_ENGINE__.componentRegistry ? window.__TES_ENGINE__.componentRegistry.get("processor") : null;

            // Switch to devices tab to inspect device rows
            const devicesTabBtn = document.querySelector('.tes-nav-tab[data-tab="devices"]');
            if (devicesTabBtn) {
              devicesTabBtn.click();
              await wait(40);
            }

            // Before reaching 1e-6 J, Processor must be hidden
            engine.state.energy = toBig("500e-9"); // 500 nJ < 1 uJ
            engine.state.peakEnergy = toBig("500e-9");
            engine.state.unlocks.processor = false;
            window.__TES_RENDERER__.render();
            await wait(30);

            const procRow = document.querySelector('[data-element-id="processor"]')?.closest('.tes-device-row');
            if (procRow && procRow.style.display !== "none") {
              throw new Error("Processor row must be hidden when stored energy < 1e-6 J");
            }

            // Upon reaching 1e-6 J (1 uJ), Processor is revealed
            engine.state.energy = toBig("1e-6");
            engine.state.peakEnergy = toBig("1e-6");
            engine.tick(0.01);
            window.__TES_RENDERER__.render();
            await wait(30);

            if (!engine.state.unlocks.processor) {
              throw new Error("Reaching 1e-6 J stored energy must unlock processor");
            }
          }
          pass("QA-32: Processor Reveal Condition (1e-6 J) & 5% Multiplier Verified");

          // ---- TEST: Notation for numbers > 99999 ----
          if (window.__TES_ENGINE__ && window.__TES_RENDERER__) {
            const energyTabBtn = document.querySelector('.tes-nav-tab[data-tab="energy"]');
            if (energyTabBtn) {
              energyTabBtn.click();
              await wait(40);
            }

            const engine = window.__TES_ENGINE__;
            engine.state.algorithms.AImp.owned = 120000;
            engine.setNotation("engineering");
            window.__TES_RENDERER__.render();
            await wait(30);

            const aimpTitle = document.querySelector('[data-field="aimp-title"]');
            if (!aimpTitle || !aimpTitle.textContent.includes("120 K")) {
              throw new Error(`AImp title should format 120,000 as 120 K in engineering: '${aimpTitle?.textContent}'`);
            }

            engine.setNotation("engineering_num");
            window.__TES_RENDERER__.render();
            await wait(30);
            if (!aimpTitle.textContent.includes("120e3")) {
              throw new Error(`AImp title should format 120,000 as 120e3 in engineering_num: '${aimpTitle?.textContent}'`);
            }

            engine.setNotation("alpha");
            window.__TES_RENDERER__.render();
            await wait(30);
            if (!aimpTitle.textContent.includes("120 A")) {
              throw new Error(`AImp title should format 120,000 as 120 A in alpha: '${aimpTitle?.textContent}'`);
            }

            // Restore engineering and normal count
            engine.state.algorithms.AImp.owned = 99999;
            engine.setNotation("engineering");
            window.__TES_RENDERER__.render();
            await wait(30);
            if (!aimpTitle.textContent.includes("99,999")) {
              throw new Error(`AImp title should format 99,999 with standard comma: '${aimpTitle?.textContent}'`);
            }
          }
          pass("QA-33: Numbers > 99999 Formatted with Selected Notation across UI & Standard Format <= 99999");

          console.log("ALL EXTENDED USER-LEVEL QA TESTS PASSED SUCCESSFULLY!");

          console.log("ALL USER-LEVEL QA TESTS PASSED SUCCESSFULLY!");
        } catch (err) {
          fail("CRITICAL_USER_QA_ERROR", err.message || err);
        } finally {
          const outEl = document.getElementById("qa-results");
          if (outEl) {
            outEl.textContent = JSON.stringify(results);
          }
          try {
            await fetch("/qa-done", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(results),
            });
          } catch (e) {
            console.error("Failed to POST /qa-done:", e);
          }
        }
      };

      window.addEventListener("load", () => {
        setTimeout(window.__QA_RUNNER__, 200);
      });
    </script>
  </body>
</html>
